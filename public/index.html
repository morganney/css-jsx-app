<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS + JSX Lit Host Demo</title>
    <link rel="stylesheet" href="./bundle.css" />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      body {
        margin: 0;
        padding: 2.5rem;
        display: grid;
        gap: 1.5rem;
        justify-items: center;
        background: radial-gradient(circle at top, #0f172a, #050814 70%);
      }
      #app,
      #extra-react-root {
        border-radius: 20px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        padding: 1.5rem;
        background: rgba(15, 23, 42, 0.55);
        box-shadow: 0 20px 40px rgba(2, 6, 23, 0.55);
        width: min(960px, 100%);
      }
      #app {
        border-color: rgba(99, 102, 241, 0.5);
      }
      #extra-react-root {
        border-color: rgba(14, 165, 233, 0.5);
        display: grid;
        gap: 1rem;
      }
      css-react-host {
        display: block;
      }
      .light-shell {
        display: grid;
        gap: 1rem;
      }
      .light-shell header {
        display: grid;
        gap: 0.35rem;
      }
      .light-shell h2 {
        margin: 0;
        font-size: 1.2rem;
      }
      .light-grid {
        display: grid;
        gap: 1rem;
      }
      .repo-footer {
        display: grid;
        justify-items: center;
        margin-top: 1rem;
        opacity: 0.8;
      }
      .repo-link {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        color: #94a3b8;
        text-decoration: none;
        font-size: 0.95rem;
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: rgba(15, 23, 42, 0.55);
        transition:
          color 150ms ease,
          border-color 150ms ease,
          background 150ms ease;
      }
      .repo-link:hover,
      .repo-link:focus-visible {
        color: #e2e8f0;
        border-color: rgba(99, 102, 241, 0.65);
        background: rgba(30, 41, 59, 0.75);
      }
    </style>
  </head>
  <body>
    <header class="repo-footer" aria-label="Demo source">
      <a
        class="repo-link"
        href="https://github.com/morganney/css-jsx-app"
        target="_blank"
        rel="noreferrer"
      >
        View this demo on GitHub →
      </a>
    </header>
    <div id="app"></div>
    <div id="extra-react-root"></div>
    <footer class="repo-footer">
      <a
        class="repo-link"
        href="https://github.com/morganney/css-jsx-app"
        target="_blank"
        rel="noreferrer"
      >
        View this demo on GitHub →
      </a>
    </footer>
    <script src="./bundle.js" type="module"></script>
  </body>
</html>
